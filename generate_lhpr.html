<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Generator LHPR (Cloud)</title>
    <!-- Library Eksternal -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Firebase SDK (Compatibility Mode) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --navy-blue: #0A192F;
            --emerald-green: #10B981;
        }
        body {
            background-color: #F3F4F6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-box {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="p-4 md:p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Header Panel -->
        <div class="card-box p-5 flex flex-col md:flex-row justify-between items-center gap-4 border-l-4 border-emerald-500">
            <div>
                <h1 class="text-xl font-bold text-slate-800">Master Generator LHPR (Cloud)</h1>
                <p class="text-xs text-slate-500">Kelola dan generate laporan LHPR dengan sinkronisasi Firebase Cloud.</p>
            </div>
            <div class="flex items-center gap-2">
                <span id="cloudStatusBadge" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">
                    <span class="w-2 h-2 mr-1.5 bg-emerald-500 rounded-full animate-pulse"></span> Firebase Sync Active
                </span>
            </div>
        </div>

        <!-- Section Control Restore & Backup -->
        <div class="card-box p-5 space-y-4">
            <h2 class="text-md font-bold text-slate-700 border-b pb-2">Manajemen Kamus & Data Cloud</h2>
            <div class="flex flex-wrap items-center gap-3">
                <label class="cursor-pointer bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-2 px-4 rounded-lg shadow transition">
                    📁 Restore Kamus (Simpan Permanen ke Cloud)
                    <input type="file" id="inputRestoreJSON" accept=".json" class="hidden" onchange="restoreKamusToCloud(event)">
                </label>
                <button onclick="backupKamusJSON()" class="bg-slate-700 hover:bg-slate-800 text-white text-xs font-semibold py-2 px-4 rounded-lg shadow transition">
                    💾 Backup Kamus (.JSON)
                </button>
            </div>
        </div>

        <!-- Section Workspace Output / Display Kamus -->
        <div class="card-box p-5">
            <h2 class="text-md font-bold text-slate-700 mb-3">Data Kamus Terdaftar</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-xs text-left text-slate-600 border-collapse">
                    <thead class="bg-slate-100 uppercase text-slate-700">
                        <tr>
                            <th class="p-3 border">No</th>
                            <th class="p-3 border">Kode Reject</th>
                            <th class="p-3 border">Deskripsi Problem</th>
                            <th class="p-3 border">Kategori / Line</th>
                        </tr>
                    </thead>
                    <tbody id="tableKamusBody">
                        <tr>
                            <td colspan="4" class="p-4 text-center text-slate-400">Memuat data dari Cloud...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // -----------------------------------------------------------------
        // 1. Kredensial Firebase Cloud
        // PASTA KREDENSIAL ASLI DARI FIREBASE CONSOLE DI SINI
        // -----------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "PASTE_API_KEY_ASLI_DI_SINI",
            authDomain: "PASTE_AUTH_DOMAIN_DI_SINI",
            projectId: "PASTE_PROJECT_ID_DI_SINI",
            storageBucket: "PASTE_STORAGE_BUCKET_DI_SINI",
            messagingSenderId: "PASTE_MESSAGING_SENDER_ID_DI_SINI",
            appId: "PASTE_APP_ID_DI_SINI"
        };

        // Inisialisasi Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const LOCAL_STORAGE_KEY = 'kamusLHPR_backup';
        let stateKamusData = [];

        // -----------------------------------------------------------------
        // 2. Load & Sync Realtime dari Cloud Saat Web Dibuka
        // -----------------------------------------------------------------
        function initCloudSync() {
            db.collection('kamus_lhpr').doc('master_data')
                .onSnapshot((doc) => {
                    if (doc.exists && doc.data().listKamus) {
                        stateKamusData = doc.data().listKamus;
                        
                        // Simpan backup ke LocalStorage
                        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(stateKamusData));
                        
                        renderTabelKamus(stateKamusData);
                        console.log("Data Kamus Cloud berhasil disinkronkan.");
                    } else {
                        loadFromLocalStorageFallback();
                    }
                }, (error) => {
                    console.warn("Firestore error / belum terkonfigurasi, menggunakan LocalStorage:", error);
                    loadFromLocalStorageFallback();
                });
        }

        function loadFromLocalStorageFallback() {
            const localData = localStorage.getItem(LOCAL_STORAGE_KEY);
            if (localData) {
                try {
                    stateKamusData = JSON.parse(localData);
                    renderTabelKamus(stateKamusData);
                } catch (e) {
                    console.error("Error reading LocalStorage:", e);
                }
            } else {
                renderTabelKamus([]);
            }
        }

        // -----------------------------------------------------------------
        // 3. Simpan Data Restore Permanen ke Firestore Cloud
        // -----------------------------------------------------------------
        async function restoreKamusToCloud(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const parsedJSON = JSON.parse(e.target.result);
                    
                    let listKamusToSave = [];
                    if (Array.isArray(parsedJSON)) {
                        listKamusToSave = parsedJSON;
                    } else if (parsedJSON.listKamus && Array.isArray(parsedJSON.listKamus)) {
                        listKamusToSave = parsedJSON.listKamus;
                    } else {
                        listKamusToSave = [parsedJSON];
                    }

                    // A. Tulis ke LocalStorage langsung
                    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(listKamusToSave));
                    stateKamusData = listKamusToSave;
                    renderTabelKamus(stateKamusData);

                    // B. Tulis Permanen ke Firestore Database
                    await db.collection('kamus_lhpr').doc('master_data').set({
                        listKamus: listKamusToSave,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });

                    alert("Data Kamus berhasil tersimpan permanen di Cloud! Data tidak akan hilang saat refresh dan otomatis sync ke HP/Laptop lain.");

                } catch (err) {
                    console.error("Detail Error Restore:", err);
                    alert("Gagal mengunggah ke Cloud. Pastikan firebaseConfig sudah diisi dengan kredensial asli. Error: " + err.message);
                }
            };
            reader.readAsText(file);
        }

        // -----------------------------------------------------------------
        // 4. Backup Data Kamus (.JSON)
        // -----------------------------------------------------------------
        function backupKamusJSON() {
            if (!stateKamusData || stateKamusData.length === 0) {
                alert("Tidak ada data kamus untuk di-backup.");
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(stateKamusData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `Backup_Kamus_LHPR_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // -----------------------------------------------------------------
        // 5. Render UI Tabel
        // -----------------------------------------------------------------
        function renderTabelKamus(data) {
            const tbody = document.getElementById('tableKamusBody');
            if (!tbody) return;

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400">Belum ada data kamus tersimpan. Silakan lakukan Restore Kamus.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map((item, index) => `
                <tr class="hover:bg-slate-50 border-b">
                    <td class="p-3 border text-center">${index + 1}</td>
                    <td class="p-3 border font-semibold text-slate-700">${item.kode || item.code || '-'}</td>
                    <td class="p-3 border">${item.deskripsi || item.description || item.nama || '-'}</td>
                    <td class="p-3 border">${item.kategori || item.line || '-'}</td>
                </tr>
            `).join('');
        }

        // -----------------------------------------------------------------
        // 6. Jalankan saat Pertama Load Halaman
        // -----------------------------------------------------------------
        document.addEventListener('DOMContentLoaded', () => {
            initCloudSync();
        });
    </script>
</body>
</html>
